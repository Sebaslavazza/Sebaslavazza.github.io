<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pedidos profesionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, tactile, editorial — a beauty brand's private order book, not a shop.
   IDEA: a lookbook spread: left page is a full-bleed skin/texture photograph that changes with the line you browse; right page is the order sheet.
   PICTURE: the ambient photo (crema, aceite, protección…) tinted to each line's colour, crossfading as you scroll.
   COLOUR and TYPE: sand #efe7dd ground, ink #2a211c, terracotta #a65a3f accent; Cormorant Garamond light for names, Jost for figures and controls.
   LAYOUT: two-column spread above 980px (sticky photo 42% / catalogue), stacked below; cart as a side sheet. */
:root{color-scheme:light dark;
 --bg:light-dark(#efe7dd,#1b1613);--paper:light-dark(#f7f2ec,#241d19);--ink:light-dark(#2a211c,#efe6dc);
 --mute:light-dark(#7d6d62,#a8988b);--line:light-dark(#dccfc2,#3a302a);--acc:light-dark(#a65a3f,#d98a6c);--tint:#a65a3f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.spread{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);min-height:100vh}
.mood{position:sticky;top:0;height:100vh;overflow:hidden;background:#3b2f28}
.mood img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,transform 6s ease;transform:scale(1.04)}
.mood img.on{opacity:1;transform:scale(1)}
.mood::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.05) 40%,rgba(20,14,10,.55));pointer-events:none}
.mood .tint{position:absolute;inset:0;background:var(--tint);mix-blend-mode:soft-light;opacity:.35;transition:background .9s}
.cap{position:absolute;left:clamp(20px,3vw,44px);bottom:clamp(24px,4vw,52px);right:24px;color:#fbf6f0;z-index:2}
.cap small{font-size:13px;letter-spacing:.02em;opacity:.85}
.cap h2{font:300 clamp(40px,5vw,72px)/1 'Cormorant Garamond',serif;margin:.15em 0 .1em}
.cap p{margin:0;max-width:34ch;font-size:15px;opacity:.9}
.sheet{padding:clamp(20px,3.4vw,48px) clamp(16px,3.4vw,52px) 120px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{font:400 15px Jost;letter-spacing:.32em;text-transform:uppercase}
h1{font:300 clamp(34px,4vw,52px)/1.05 'Cormorant Garamond',serif;margin:28px 0 6px;text-wrap:balance}
.who{color:var(--mute);margin:0 0 22px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding:6px 2px}
.search input{border:0;background:none;outline:none;font-size:17px;width:100%;padding:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.qty button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sep{width:1px;background:var(--line);margin:4px 4px}
.group{margin-top:34px}
.group h3{font:300 30px/1.1 'Cormorant Garamond',serif;margin:0 0 4px;display:flex;align-items:baseline;gap:12px}
.group h3 span{font:400 13px Jost;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin-top:14px}
.card{background:var(--paper);border-radius:4px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
.card:hover{transform:translateY(-2px)}
.ph{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.ph.none{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#f6efe7),color-mix(in srgb,var(--c) 45%,#e9dccf))}
.ph.none b{font:300 22px/1.1 'Cormorant Garamond',serif;color:#3a2c24;text-align:center;padding:16px}
.tag{position:absolute;top:8px;left:8px;font-size:12px;background:rgba(255,255,255,.85);color:#3a2c24;padding:2px 8px;border-radius:99px}
.bd{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font:400 19px/1.15 'Cormorant Garamond',serif}
.mt{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.pr{font-weight:500;white-space:nowrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px;border-radius:999px}
.qty input{width:34px;text-align:center;border:0;background:none;font-size:16px;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{display:none}
.card.in{box-shadow:inset 0 0 0 1.5px var(--acc)}
.empty{padding:60px 0;color:var(--mute);text-align:center}
.bag{position:fixed;right:clamp(14px,3vw,36px);bottom:clamp(14px,3vw,30px);z-index:20;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 22px;cursor:pointer;box-shadow:0 10px 30px rgba(40,25,15,.25);font-size:15px}
.bag b{font-weight:500}
.drawer{position:fixed;inset:0;z-index:30;display:none}
.drawer.open{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(30,20,14,.45)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--paper);display:flex;flex-direction:column;padding:26px 24px}
.panel h4{font:300 34px 'Cormorant Garamond',serif;margin:0 0 4px}
.lines{flex:1;overflow:auto;margin:14px -4px;padding:0 4px}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li img,.li i{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:3px;display:block}
.li .nm{font-size:17px}
.tot{display:flex;justify-content:space-between;font-size:18px;padding:10px 0}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:10px;font-size:16px;resize:vertical}
.btn{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer;margin-top:12px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.x{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;background:none;font-size:26px;cursor:pointer}
.done{text-align:center;padding:40px 10px}
.done h4{font-size:40px}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:4px;font-size:13px;max-height:220px;overflow:auto}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center}.gate h2{font:300 44px/1.05 'Cormorant Garamond',serif;margin:0 0 10px}.gate p{color:var(--mute);max-width:36ch;margin:0 auto}
@media(max-width:980px){.spread{grid-template-columns:1fr}.mood{position:relative;height:46vh;min-height:300px}}
@media(prefers-reduced-motion:reduce){.mood img{transition:none;transform:none}.card{transition:none}}
</style>
</head>

<div class="spread">

  <div class="tint" id="tint"></div>
  <div class="cap"><small id="capB">Pedidos profesionales</small><h2 id="capT">El cuidado de la piel</h2><p id="capP">Esthederm y Natinuel, a precio profesional. Elige, ajusta cantidades y envía tu pedido.</p></div>

 </main>
</div>
<button class="bag" id="bag" type="button"><span>Mi pedido</span><b id="bagN">0 uds</b><span id="bagT">0,00 €</span></button>
<div class="drawer" id="dr" role="dialog" aria-modal="true" aria-label="Tu pedido">
 <div class="bg" data-close></div>
 <div class="panel" id="panel"></div>
</div>

// state
let cart={};try{cart=JSON.parse(localStorage.getItem('pedido')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('pedido',JSON.stringify(cart))}catch(e){}};
let f={m:'Todas',u:'Todo',q:''};
// mood
const mood=$('#mood');IMG.forEach(k=>{const i=new Image();i.src='amb/'+k+'.jpg';i.alt='';i.dataset.k=k;mood.prepend(i)});
let curL='';
function setMood(l){if(l===curL)return;curL=l;const o=L[l]||{t:'El cuidado de la piel',d:'',c:'#a65a3f',img:'hero'};
 mood.querySelectorAll('img').forEach(i=>i.classList.toggle('on',i.dataset.k===o.img));
 $('#tint').style.background=o.c;$('#capT').textContent=o.t;$('#capP').textContent=o.d||'Esthederm y Natinuel, a precio profesional.';
 $('#capB').textContent=l==='natinuel'?'Natinuel':l?'Esthederm':'Pedidos profesionales'}
setMood('');
// filters
const chips=(el,key,opts)=>{el.innerHTML=opts.map(o=>`<button class="chip" type="button" data-k="${key}" data-v="${esc(o)}" aria-pressed="${f[key]===o}">${esc(o)}</button>`).join('')};
function drawChips(){chips($('#fm'),'m',['Todas','Esthederm','Natinuel']);chips($('#fl'),'u',['Todo','Venta','Cabina','Con foto'])}
document.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){f[b.dataset.k]=b.dataset.v;drawChips();render()}});
$('#q').addEventListener('input',e=>{f.q=e.target.value.trim().toLowerCase();render()});
// render
function card(p){const q=cart[p.r]||0;
 const ph=p.f?`<img loading="lazy" src="${file(p.r)}" alt="${esc(p.n)}">`:`<b>${esc(p.n)}</b>`;
 return `<article class="card${q?' in':''}" data-l="${p.l}" data-r="${esc(p.r)}"><div class="ph${p.f?'':' none'}" style="--c:${L[p.l].c}">${ph}<span class="tag">${esc(p.u)}</span></div>
 <div class="bd"><div class="nm">${esc(p.n)}</div><div class="mt">${esc(p.r)}${p.t?' · '+esc(p.t):''}</div>
 <div class="row"><span class="pr">${eur(p.p)}</span><span class="qty"><button type="button" data-a="-" aria-label="Quitar uno">−</button><input inputmode="numeric" value="${q}" aria-label="Cantidad"><button type="button" data-a="+" aria-label="Añadir uno">+</button></span></div></div></article>`}
function render(){
 const list=P.filter(p=>(f.m==='Todas'||p.m===f.m)&&(f.u==='Todo'||(f.u==='Con foto'?p.f:p.u===f.u))&&(!f.q||(p.n+' '+p.r).toLowerCase().includes(f.q)));
 const groups={};list.forEach(p=>(groups[p.l]??=[]).push(p));
 const order=Object.keys(L).filter(k=>groups[k]);
 $('#list').innerHTML=order.length?order.map(k=>`<section class="group" data-l="${k}"><h3>${esc(L[k].t)}<span>${groups[k].length} productos</span></h3><div class="grid">${groups[k].map(card).join('')}</div></section>`).join(''):'<p class="empty">No hay productos con ese filtro.</p>';
 observe();totals()}
// qty
function setQ(r,q){q=Math.max(0,Math.min(999,q|0));if(q)cart[r]=q;else delete cart[r];save();
 const c=document.querySelector(`.card[data-r="${CSS.escape(r)}"]`);if(c){c.querySelector('input').value=q;c.classList.toggle('in',!!q)}totals()}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.qty button');if(!b)return;const r=b.closest('.card').dataset.r;setQ(r,(cart[r]||0)+(b.dataset.a==='+'?1:-1))});
$('#list').addEventListener('change',e=>{if(e.target.matches('.qty input'))setQ(e.target.closest('.card').dataset.r,parseInt(e.target.value)||0)});
$('#list').addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(c)setMood(c.dataset.l)});
function totals(){let n=0,t=0;for(const[r,q]of Object.entries(cart)){const p=byRef[r];if(!p)continue;n+=q;t+=(p.p||0)*q}
 $('#bagN').textContent=n+' uds';$('#bagT').textContent=eur(t);return{n,t}}
// scroll-linked mood
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting)setMood(x.target.dataset.l)})},{rootMargin:'-30% 0px -60% 0px'});document.querySelectorAll('.group').forEach(g=>io.observe(g))}
// drawer
const dr=$('#dr'),panel=$('#panel');
function openCart(){const items=Object.entries(cart).filter(([r])=>byRef[r]);const {n,t}=totals();
 panel.innerHTML=`<button class="x" data-close aria-label="Cerrar">×</button><h4>Tu pedido</h4><div class="mt">${client.code?'Cliente '+esc(client.code)+' · ':''}${n} unidades</div>
 <div class="lines">${items.length?items.map(([r,q])=>{const p=byRef[r];return `<div class="li">${p.f?`<img src="${file(r)}" alt="">`:'<i></i>'}<div><div class="nm">${esc(p.n)}</div><div class="mt">${esc(r)} · ${eur(p.p)}</div></div><span class="qty" data-r="${esc(r)}"><button type="button" data-a="-" aria-label="Quitar uno">−</button><input value="${q}" inputmode="numeric" aria-label="Cantidad"><button type="button" data-a="+" aria-label="Añadir uno">+</button></span></div>`}).join(''):'<p class="empty">Aún no has añadido productos.</p>'}</div>
 <div class="tot"><span>Total PVL</span><b>${eur(t)}</b></div>
 <label class="mt" for="obs">Observaciones (entrega, horario…)</label><textarea id="obs"></textarea>
 <button class="btn" id="send" type="button" ${items.length?'':'disabled'}>Enviar pedido</button>
 <p class="note">El precio final lo ajusta tu tarifa en Factusol. Recibirás la confirmación por correo.</p>`;
 dr.classList.add('open')}
$('#bag').addEventListener('click',openCart);
dr.addEventListener('click',e=>{if(e.target.closest('[data-close]'))dr.classList.remove('open');
 const b=e.target.closest('.qty button');if(b){const r=b.parentElement.dataset.r;setQ(r,(cart[r]||0)+(b.dataset.a==='+'?1:-1));openCart()}
 if(e.target.id==='send')send();if(e.target.id==='copy')copy();if(e.target.id==='new'){cart={};save();render();dr.classList.remove('open')}});
dr.addEventListener('change',e=>{const s=e.target.closest('.qty');if(s){setQ(s.dataset.r,parseInt(e.target.value)||0);openCart()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')dr.classList.remove('open')});
// order
const WEBHOOK='';// se rellena al publicar en el hosting definitivo (Neo → Factusol)
let lastText='';
function order(){const obs=($('#obs')||{}).value||'';const lines=Object.entries(cart).filter(([r])=>byRef[r]).map(([r,q])=>({ref:r,nombre:byRef[r].n,cantidad:q,pvl:byRef[r].p}));
 return{cliente:client.code||null,nombre:client.name||null,fecha:new Date().toISOString(),lineas:lines,observaciones:obs,total_pvl:+lines.reduce((a,l)=>a+(l.pvl||0)*l.cantidad,0).toFixed(2)}}
async function send(){const o=order();lastText='Pedido '+(o.cliente?'cliente '+o.cliente:'')+'\n'+o.lineas.map(l=>`${l.cantidad} x ${l.ref} ${l.nombre}`).join('\n')+(o.observaciones?'\nObs: '+o.observaciones:'')+'\nTotal PVL: '+eur(o.total_pvl);
 let ok=false;if(WEBHOOK){try{const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});ok=r.ok}catch(e){}}
 panel.innerHTML=`<button class="x" data-close aria-label="Cerrar">×</button><div class="done">${ok?`<h4>Pedido enviado</h4><p>Gracias. Te confirmaremos el pedido por correo.</p><button class="btn" id="new" type="button">Hacer otro pedido</button>`:
 `<h4>Pedido listo</h4><p class="mt">Vista previa: el envío automático a Neo se activa al publicar la web definitiva. Este es el pedido que se enviaría:</p><pre>${esc(lastText)}</pre><button class="btn" id="copy" type="button">Copiar pedido</button><button class="btn ghost" id="new" type="button">Vaciar y empezar otro</button>`}</div>`}
async function copy(){try{await navigator.clipboard.writeText(lastText);$('#copy').textContent='Copiado'}catch(e){$('#copy').textContent='Selecciona el texto y cópialo'}}
drawChips();render();
}
</script>
</body>
</html>
